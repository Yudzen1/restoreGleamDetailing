name: Website health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'tools/**'
      - '.github/workflows/website-health.yml'
  pull_request:
    paths:
      - '*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'tools/**'
      - '.github/workflows/website-health.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: website-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test lead form behavior
        run: node tools/test_lead_form.mjs
      - name: Validate page generator syntax
        run: python3 -m py_compile tools/build_service_pages.py
      - name: Check committed pages
        run: node tools/check_site.mjs
      - name: Check live domain
        if: github.event_name != 'pull_request'
        run: node tools/check_site.mjs --live
      - name: Publish check summary
        if: always()
        run: |
          node -e "const fs=require('fs'); const p='health-reports/latest.json'; if(fs.existsSync(p)){const r=JSON.parse(fs.readFileSync(p)); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ['Website health: '+(r.ok?'PASS':'FAIL'),'Mode: '+r.mode,'Checked: '+r.checked_at,'',r.scope,''].join(String.fromCharCode(10)));}"
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-health-${{ github.run_id }}
          path: health-reports/
          retention-days: 30
